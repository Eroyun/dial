name: Bug report
description: Something doesn't work with your display or touch screen
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: What you did, what you expected, what you saw instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Probe output
      description: Paste the output of `/Applications/Dial.app/Contents/MacOS/Dial --probe`
      render: text
    validations:
      required: true
  - type: textarea
    attributes:
      label: Dial log
      description: "Optional. Paste the last lines of `~/Library/Logs/Dial.log` (in Finder: Go → Go to Folder…, then paste that path)."
      render: text
  - type: input
    attributes:
      label: Mac and macOS version
      placeholder: MacBook Pro M5, macOS 27.2
    validations:
      required: true
  - type: input
    attributes:
      label: Monitor and connection
      placeholder: UPERFECT ZX245CQ over USB-C
